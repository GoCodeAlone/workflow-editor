name: Publish Maintenance

on:
  push:
    tags: ['v0.2.*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@gocodealone'

      - name: Verify maintenance release identity
        run: node scripts/verify-maintenance-release.mjs "$TAG"
        env:
          TAG: ${{ github.ref_name }}

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx eslint --config scripts/yaml-security-eslint.config.mjs src/utils/yamlSecurity.test.ts --max-warnings=0
      - run: npm run build
      - run: node --test scripts/pack-maintenance.node-tests.mjs scripts/maintenance-workflows.node-tests.mjs
      - name: Publish verified maintenance tarball
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-maintenance-release.mjs "$TAG"
          node scripts/pack-maintenance.mjs "$RUNNER_TEMP/editor-package" > "$RUNNER_TEMP/editor-pack.json"
          tarball=$(jq -er '.tarball' "$RUNNER_TEMP/editor-pack.json")
          node scripts/verify-yaml-security.mjs "$tarball" "$(git rev-parse HEAD)"
          npm publish "$tarball" --tag maintenance-0.2
          gh release create "$TAG" "$tarball" --verify-tag --latest=false \
            --title "Workflow Editor $TAG (0.2 maintenance)" \
            --notes "Compatible bundled YAML security backport for 0.2 consumers."
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
