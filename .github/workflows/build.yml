name: Build

on:
  push:
    branches: [release/0.2.x]
  pull_request:
    branches: [release/0.2.x]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@gocodealone'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx eslint --config scripts/yaml-security-eslint.config.mjs src/utils/yamlSecurity.test.ts --max-warnings=0
      - run: npm run build
      - run: node --test scripts/pack-maintenance.node-tests.mjs scripts/maintenance-workflows.node-tests.mjs
      - name: Verify actual packed consumers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pack-maintenance.mjs "$RUNNER_TEMP/editor-package" > "$RUNNER_TEMP/editor-pack.json"
          tarball=$(jq -er '.tarball' "$RUNNER_TEMP/editor-pack.json")
          node scripts/verify-yaml-security.mjs "$tarball" "$(git rev-parse HEAD)"
          git diff --exit-code HEAD
