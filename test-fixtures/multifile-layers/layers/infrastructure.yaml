modules:
  - name: primary-db
    type: database.postgres
    config:
      host: localhost
      port: 5432
      database: app
  - name: cache
    type: nosql.redis
    config:
      host: localhost
      port: 6379
  - name: message-queue
    type: messaging.rabbitmq
    config:
      host: localhost
      port: 5672
  - name: logger
    type: observability.logger
    config:
      level: info
